services:
  preisverwaltung:
    build: .
    container_name: preisverwaltung
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env            # PV_USER, PV_PASSWORD, GCP_API_KEY, … (siehe .env.example)
    volumes:
      # Named Volume: Docker übernimmt beim ersten Start die Rechte aus dem Image (Benutzer pv),
      # dadurch kann die App die SQLite-Datenbank anlegen. (Ein Bind-Mount wie ./data würde
      # als root angelegt und wäre für den App-Benutzer nicht beschreibbar.)
      - preisdaten:/data
      - ./config.toml:/app/config.toml:ro     # Regionen/Dienste anpassen ohne Neubau

volumes:
  preisdaten:
